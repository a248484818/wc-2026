<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pitch:#0b6b3f;--pitch-dark:#08492b;--gold:#f5c518;--gold-light:#ffe066;--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#16213e;--text:#e8e8f0;--text-dim:#8888aa;--accent:#00d49a;--red:#e74c3c;--radius:10px;--shadow:0 4px 24px rgba(0,0,0,0.4)}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;background-image:radial-gradient(ellipse at 20% 50%,rgba(11,107,63,0.12) 0%,transparent 60%),radial-gradient(ellipse at 80% 50%,rgba(245,197,24,0.06) 0%,transparent 60%)}
.header{background:linear-gradient(135deg,var(--pitch-dark) 0%,#0d2240 100%);padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:100}
.header-logo{display:flex;align-items:center;gap:12px}.header-logo .trophy{color:var(--gold);width:32px;height:32px}
.header h1{font-size:1.25rem;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--gold-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header-date{font-size:.8rem;color:var(--text-dim)}
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid rgba(255,255,255,0.06);overflow-x:auto;position:sticky;top:64px;z-index:99}
.tab-btn{flex-shrink:0;padding:12px 20px;font-size:.88rem;font-weight:600;color:var(--text-dim);background:none;border:none;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;border-bottom:3px solid transparent}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,0.04)}.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}.tab-btn i{width:18px;height:18px}
.main{max-width:1200px;margin:0 auto;padding:16px}.tab-panel{display:none}.tab-panel.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--surface);border-radius:var(--radius);padding:20px;margin-bottom:16px;border:1px solid rgba(255,255,255,0.05);box-shadow:var(--shadow)}
.card-title{font-size:1rem;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;color:var(--gold)}.card-title i{width:20px;height:20px}
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.group-card{background:var(--surface);border-radius:var(--radius);overflow:hidden;border:1px solid rgba(255,255,255,0.05);box-shadow:var(--shadow)}
.group-header{background:linear-gradient(135deg,var(--pitch-dark),#123d2a);padding:12px 16px;font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:8px;color:var(--gold)}
.group-header span{color:var(--text-dim);font-weight:400;margin-left:auto;font-size:.75rem}
.group-table{width:100%;border-collapse:collapse;font-size:.82rem}
.group-table th{padding:8px 6px;text-align:left;font-weight:600;color:var(--text-dim);font-size:.72rem;border-bottom:1px solid rgba(255,255,255,0.06)}
.group-table th:not(:first-child){text-align:center;width:auto;min-width:32px}
.group-table td{padding:8px 6px;border-bottom:1px solid rgba(255,255,255,0.03);vertical-align:middle}
.group-table td:not(:first-child){text-align:center}.group-table tr:last-child td{border-bottom:none}
.group-table tr{cursor:pointer;transition:background .12s}.group-table tr:hover{background:rgba(255,255,255,0.06)}
.group-table .team-cell{display:flex;align-items:center;gap:8px}
.group-table 
.group-table .rank{color:var(--text-dim);font-size:.7rem;width:18px;display:inline-block;text-align:center;flex-shrink:0}
.match-day{font-size:.88rem;font-weight:700;color:var(--gold);margin:20px 0 10px;padding-left:4px;display:flex;align-items:center;gap:8px}.match-day i{width:16px;height:16px}
.match-list{display:flex;flex-direction:column;gap:6px}
.match-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,0.03);border-radius:8px;transition:background .12s;cursor:pointer}
.match-item:hover{background:rgba(255,255,255,0.07)}
.match-time{min-width:66px;font-size:.72rem;color:var(--text-dim);text-align:center;flex-shrink:0;line-height:1.3}
.match-team{flex:1;display:flex;align-items:center;gap:6px;font-weight:600;font-size:.85rem}
.match-team.right{justify-content:flex-end}.match-team img{width:20px;height:14px;border-radius:2px;object-fit:cover;background:#333}
.match-score{font-size:1rem;font-weight:800;min-width:42px;text-align:center;color:var(--text-dim);flex-shrink:0}
.match-status{font-size:.62rem;padding:2px 6px;border-radius:4px;font-weight:700;text-transform:uppercase}
.match-status.upcoming{background:rgba(255,255,255,0.05);color:var(--text-dim)}
.match-time-detail{font-size:.54rem;color:var(--text-dim);margin-top:1px;letter-spacing:.3px;line-height:1.2}
.match-venue{font-size:.6rem;color:var(--text-dim);min-width:70px;text-align:right;flex-shrink:0}.pred-bar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:3px;width:100%}.pred-bar .pred-h{background:var(--accent)}.pred-bar .pred-d{background:var(--text-dim)}.pred-bar .pred-a{background:var(--red)}
.pred-container{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pred-section{background:rgba(255,255,255,0.03);border-radius:8px;padding:10px 14px}
.pred-section-title{font-size:.72rem;font-weight:600;color:var(--text-dim);margin-bottom:6px;text-align:center}
.pred-labels{display:flex;justify-content:space-between;font-size:.6rem;color:var(--text-dim);margin-top:2px}
.pred-lbl{flex:1;text-align:center}.pred-lbl-h{text-align:left}.pred-lbl-d{text-align:center}.pred-lbl-a{text-align:right}
.pred-opt{display:inline-block;padding:2px 8px;font-size:.65rem;border-radius:4px;cursor:pointer;color:var(--text-dim);transition:all .12s;background:rgba(255,255,255,0.04)}
.pred-opt:hover{color:var(--text);background:rgba(255,255,255,0.1)}
.pred-opt.active{color:var(--gold);background:rgba(245,197,24,0.12)}
.pred-opt-row{display:flex;gap:4px;margin-bottom:6px;flex-wrap:wrap;justify-content:center}


.bracket-wrapper{overflow-x:auto;padding-bottom:30px}
.bracket{display:flex;gap:0;min-width:820px;padding-top:20px}
.bracket-col{display:flex;flex-direction:column;flex-shrink:0;min-width:140px;position:relative;padding-right:18px;margin-right:6px}
.bracket-col::after{content:'';position:absolute;right:0;top:0;bottom:0;width:1.5px;background:linear-gradient(180deg,transparent 5%,rgba(255,255,255,0.12) 15%,rgba(255,255,255,0.12) 85%,transparent 95%)}
.bracket-col:last-child::after{display:none}.bracket-col-title{font-size:.7rem;font-weight:700;color:var(--gold);text-align:center;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px}
.bracket-match-wrap{position:relative;display:flex;flex-direction:column;justify-content:center}
.bracket-match{background:var(--surface);border-radius:6px;border:1px solid rgba(255,255,255,0.08);padding:7px 10px;font-size:.72rem;cursor:pointer;transition:all .12s;position:relative;z-index:2}
.bracket-match:hover{border-color:var(--accent);background:var(--surface2)}
.bracket-match .bm-team{display:flex;align-items:center;gap:4px;padding:2px 0;justify-content:space-between}
.bracket-match .bm-team .bm-name{display:flex;align-items:center;gap:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.bracket-match .bm-team .bm-score{font-weight:700;min-width:14px;text-align:right}
.bracket-match img{width:13px;height:9px;border-radius:1px;object-fit:cover;background:#333}.bracket-match .bm-tbd{color:var(--text-dim);font-style:italic}
.bracket-col:not(:last-child) .bracket-match::after{content:'';position:absolute;right:-22px;top:50%;width:20px;height:1.5px;background:rgba(255,255,255,0.12);z-index:3}
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar input,.filter-bar select{background:var(--surface);color:var(--text);border:1px solid rgba(255,255,255,0.12);border-radius:6px;padding:7px 12px;font-size:.82rem}
.filter-bar input::placeholder{color:var(--text-dim)}.filter-bar select{cursor:pointer}
.filter-bar input:focus,.filter-bar select:focus{outline:none;border-color:var(--gold)}
.filter-bar .search-wrap{position:relative;flex:1;min-width:160px;max-width:280px}
.filter-bar .search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-dim)}
.filter-bar .search-wrap input{padding-left:32px;width:100%}
.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.team-card{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-radius:8px;border:1px solid rgba(255,255,255,0.04);cursor:pointer;transition:all .12s}
.team-card:hover{background:var(--surface2);border-color:var(--accent)}
.team-card img{width:28px;height:20px;border-radius:3px;object-fit:cover;background:#333}
.team-card .info{flex:1;min-width:0}.team-card .info .name{font-weight:600;font-size:.82rem}.team-card .info .confed{font-size:.65rem;color:var(--text-dim)}.team-card .rank-badge{font-size:.65rem;color:var(--text-dim);font-weight:700}
.info-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;justify-content:center}
.info-badge{display:flex;align-items:center;gap:6px;background:var(--surface);padding:8px 14px;border-radius:20px;font-size:.78rem;border:1px solid rgba(255,255,255,0.06)}
.info-badge i{width:16px;height:16px;color:var(--gold)}
.footer{text-align:center;padding:24px 16px;font-size:.75rem;color:var(--text-dim);border-top:1px solid rgba(255,255,255,0.04);margin-top:20px}
.ef{display:inline-block;vertical-align:middle;line-height:1;flex-shrink:0}
.bracket-match .ef{display:inline-block;vertical-align:middle;line-height:1;flex-shrink:0}
.team-card .ef{display:inline-block;vertical-align:middle;line-height:1;flex-shrink:0}
.match-team .ef{display:inline-block;vertical-align:middle;line-height:1;flex-shrink:0}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.65);backdrop-filter:blur(3px);z-index:200;justify-content:center;align-items:center;overflow-y:auto;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 12px 60px rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.06);animation:modalIn .25s ease}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{position:sticky;top:0;background:var(--surface);padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06);z-index:2}
.modal-header h2{font-size:1.05rem;font-weight:700}.modal-close{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:6px;border-radius:6px;transition:all .12s}
.modal-close:hover{background:rgba(255,255,255,0.08);color:var(--text)}.modal-close i{width:20px;height:20px}
.modal-body{padding:20px}
.team-detail-header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.team-detail-header .td-flag{width:64px;height:44px;border-radius:6px;object-fit:cover;background:#333}
.team-detail-header .td-info h3{font-size:1.3rem;font-weight:700}
.team-detail-header .td-info .td-meta{font-size:.78rem;color:var(--text-dim);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
.team-detail-header .td-info .td-meta span{display:flex;align-items:center;gap:4px}
.stat-bar-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-bar-item{text-align:center;padding:12px 8px;background:rgba(255,255,255,0.03);border-radius:8px}
.stat-bar-item .num{font-size:1.3rem;font-weight:800;color:var(--gold)}.stat-bar-item .label{font-size:.68rem;color:var(--text-dim);margin-top:4px}
.td-match-list{display:flex;flex-direction:column;gap:4px}.td-match-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,0.02);border-radius:6px;font-size:.78rem}
.td-match-row .tdm-opp{flex:1;display:flex;align-items:center;gap:4px}.td-match-row img{width:16px;height:11px;border-radius:1px;object-fit:cover;background:#333}
.td-match-row .tdm-info{font-size:.62rem;color:var(--text-dim);min-width:80px;text-align:right}
.md-header{text-align:center;padding:10px 0 20px}.md-teams{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px}
.md-team{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:100px}
.md-team img{width:56px;height:38px;border-radius:5px;object-fit:cover;background:#333}.md-team .md-name{font-weight:700;font-size:.9rem}
.md-score-big{font-size:1.8rem;color:var(--text-dim);font-weight:600}
.md-meta{font-size:.75rem;color:var(--text-dim)}.md-meta i{width:14px;height:14px;vertical-align:middle}
@media(max-width:640px){
  .header h1{font-size:1rem}.header{padding:0 12px}.main{padding:10px}
  .group-grid{grid-template-columns:1fr}.teams-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .tab-btn{padding:10px 12px;font-size:.78rem}.match-item{padding:8px 10px;flex-wrap:wrap;gap:6px}
  .bracket-col{min-width:110px}.modal{max-width:100%;margin:10px;border-radius:10px}
  .team-detail-header .td-flag{width:48px;height:34px}.stats-grid{grid-template-columns:1fr}.filter-bar .search-wrap{max-width:100%}
}
</style>
</head>

      home={cc:h,name:h};away={cc:a,name:a};dt=KO_DATES[i];tm=KO_TIMES[i%KO_TIMES.length];
    }else{
      home={cc:'TBD',name:'\u5f85\u5b9a'};away={cc:'TBD',name:'\u5f85\u5b9a'};dt='\u5f85\u5b9a';tm='--:--';
    }
    matchesData.push({id:'ko-'+rn+'-'+i,round:rn,roundName:nm,tournament:'knockout',bjDate:dt,bjTime:tm,home:home,away:away,stadium:'',status:'UPCOMING'});
  }
}
var r32_matches=KO_BRACKET.length;
['r2','r3','r4'].forEach(function(rn,ri){
  var cnt=[8,4,2][ri];
  for(var i=0;i<cnt;i++){
    var w1=r32_matches-cnt*2+i*2;var w2=w1+1;
    var mid='ko-'+rn+'-'+i;var m=matchesData.find(function(x){return x.id===mid});
    if(m){m.home={cc:'W'+(w1+1),name:'W'+(w1+1)};m.away={cc:'W'+(w2+1),name:'W'+(w2+1)}}
  }
});

var groupData=JSON.parse(JSON.stringify(GT));
groupData.forEach(function(g){
  g.teams.forEach(function(t){t.pl=0;t.w=0;t.d=0;t.l=0;t.gf=0;t.ga=0;t.gd=0;t.pts=0});
});

var tQ='',tC='all',tS='rank';

function openM(t,html){
  document.getElementById('modalTitle').textContent=t;
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow='hidden';
  try{lucide.createIcons()}catch(e){}
}
function closeM(){
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow='';
}

function showTD(cc,gId){
  var g=GT.find(function(x){return x.id===gId});
  var t=g?g.teams.find(function(x){return x.cc===cc}):null;
  if(!t)return;
  var cf=CF[cc]||'\u5176\u4ed6';
  var ms=matchesData.filter(function(m){return(m.home.cc===cc||m.away.cc===cc)&&m.round==='group'});
  var mr=ms.map(function(m){
    var ih=m.home.cc===cc;var opp=ih?m.away:m.home;
    return '<div class="td-match-row"><span class="tdm-opp">'+fs(opp.cc,16)+' '+opp.name+'</span><span class="tdm-info">'+m.bjDate+' '+m.bjTime+' \u00b7 '+m.stadium+'</span></div>';
  }).join('');
  var html='<div class="team-detail-header"><span class="ef" style="font-size:52px">'+fl(cc)+'</span><div class="td-info"><h3>'+t.name+'</h3><div class="td-meta"><span><i data-lucide="flag" style="width:14px;height:14px"></i> '+cf+'</span><span><i data-lucide="layers" style="width:14px;height:14px"></i> '+gId+'\u7ec4</span><span><i data-lucide="trending-up" style="width:14px;height:14px"></i> FIFA #'+t.r+'</span></div></div></div><div class="stat-bar-grid"><div class="stat-bar-item"><div class="num">'+t.r+'</div><div class="label">FIFA \u6392\u540d</div></div><div class="stat-bar-item"><div class="num">'+cf+'</div><div class="label">\u6240\u5c5e\u5927\u6d32</div></div><div class="stat-bar-item"><div class="num">'+gId+'</div><div class="label">\u5c0f\u7ec4</div></div></div><div style="font-size:.85rem;font-weight:700;color:var(--gold);margin:16px 0 10px"><i data-lucide="calendar" style="width:16px;height:16px;display:inline;margin-right:6px"></i>\u5c0f\u7ec4\u8d5b\u8d5b\u7a0b</div><div class="td-match-list">'+(mr||'<div style="font-size:.78rem;color:var(--text-dim)">\u6682\u65e0\u5b89\u6392</div>')+'</div>';
  openM(t.name,html);
}

function getPredKey(m){
  var h=m.home.cc;var a=m.away.cc;
  var keys=[h+'_'+a];
  if(PRED[keys[0]]!==undefined)return keys[0];
  return null;
}


function showMD(id){
  var m=matchesData.find(function(x){return x.id===id});
  if(!m||m.home.cc==='TBD')return;
  var pk=m.home.cc+'_'+m.away.cc;
  var pH=PRED[pk]||null,pD=PRED_D[pk]||null,pA=pH!==null&&pD!==null?(1-pH-pD):null;
  var spreadData=PRED_SPREADS[pk];
  var ouData=PRED_OUS[pk];
  var html='<div class="md-header"><div class="md-teams">';
  html+='<div class="md-team"><span class="ef" style="font-size:42px">'+fl(m.home.cc)+'</span><div class="md-name">'+fn(m.home.cc,m.home.name,18)+'</div></div>';
  var scBig=(m.home.score!==undefined)?m.home.score+'-'+m.away.score:'vs';html+='<div class="md-score-big">'+scBig+'</div>';
  html+='<div class="md-team"><span class="ef" style="font-size:42px">'+fl(m.away.cc)+'</span><div class="md-name">'+fn(m.away.cc,m.away.name,18)+'</div></div>';
  html+='</div></div>';
  html+='<div class="md-meta" style="text-align:center;margin-bottom:16px">';
  html+=''+(m.status==='FINISHED'?'<span class="match-status" style="display:inline-block;font-size:.7rem;margin-bottom:6px;background:rgba(0,212,154,0.2);color:var(--accent)">\u5df2\u8d5b</span>':'<span class="match-status upcoming" style="display:inline-block;font-size:.7rem;margin-bottom:6px">\u672a\u8d5b</span>')+'<br>';
  html+='<i data-lucide="calendar" style="width:14px;height:14px"></i> '+m.bjDate+' '+m.bjTime+' \u5f00\u7403<br>';
  html+='<i data-lucide="map-pin" style="width:14px;height:14px"></i> '+(m.stadium||'\u5f85\u5b9a');
  html+='</div><div class="pred-container">';
  if(pH!==null&&pA!==null){
    html+='<div class="pred-section"><div class="pred-section-title">\u80dc\u5e73\u8d1f</div>';
    html+='<div class="pred-bar" style="height:6px"><div class="pred-h" style="flex:'+Math.round(pH*100)+'"></div><div class="pred-d" style="flex:'+Math.round(pD*100)+'"></div><div class="pred-a" style="flex:'+Math.round(pA*100)+'"></div></div>';
    html+='<div class="pred-labels"><span class="pred-lbl pred-lbl-h">\u4e3b '+Math.round(pH*100)+'%</span><span class="pred-lbl pred-lbl-d">\u5e73 '+Math.round(pD*100)+'%</span><span class="pred-lbl pred-lbl-a">\u5ba2 '+Math.round(pA*100)+'%</span></div></div>';
  }
  if(spreadData){
    var spLines=Object.keys(spreadData);
    if(spLines.length>0){
      var defSp=spLines[0];var spVal=spreadData[defSp];
      html+='<div class="pred-section pr-spread"><div class="pred-section-title">\u8ba9\u7403</div><div class="pred-opt-row">';
      for(var si=0;si<spLines.length;si++){
        var sl=spLines[si];
        html+='<span class="pred-opt'+(si===0?' active':'')+'" onclick="pickLine(this)" data-type="sp" data-pk="'+pk+'" data-line="'+sl+'">'+sl+'</span>';
      }
      html+='</div>';
      var spPct=Math.round(spVal*100);
      html+='<div class="pred-bar" style="height:6px"><div class="pred-h" style="flex:'+spPct+'"></div><div class="pred-a" style="flex:'+(100-spPct)+'"></div></div>';
      html+='<div class="pred-labels"><span class="pred-lbl pred-lbl-h">\u4e3b '+spPct+'%</span><span class="pred-lbl pred-lbl-a">\u5ba2 '+(100-spPct)+'%</span></div></div>';
    }
  }
  if(ouData){
    var ouLines=Object.keys(ouData);
    if(ouLines.length>0){
      var defOu=ouLines[0];var ouVal=ouData[defOu];
      html+='<div class="pred-section pr-ou"><div class="pred-section-title">\u603b\u5206</div><div class="pred-opt-row">';
      for(var oi=0;oi<ouLines.length;oi++){
        var ol=ouLines[oi];
        html+='<span class="pred-opt'+(oi===0?' active':'')+'" onclick="pickLine(this)" data-type="ou" data-pk="'+pk+'" data-line="'+ol+'">'+ol+'</span>';
      }
      html+='</div>';
      var ouPct=Math.round(ouVal*100);
      html+='<div class="pred-bar" style="height:6px"><div class="pred-h" style="flex:'+ouPct+'"></div><div class="pred-a" style="flex:'+(100-ouPct)+'"></div></div>';
      html+='<div class="pred-labels"><span class="pred-lbl pred-lbl-h">\u5927 '+ouPct+'%</span><span class="pred-lbl pred-lbl-a">\u5c0f '+(100-ouPct)+'%</span></div></div>';
    }
  }
  html+='</div>';
  openM(m.home.name+' vs '+m.away.name,html);
}

function pickLine(el){
  var type=el.getAttribute("data-type");
  var pk=el.getAttribute("data-pk");
  var line=el.getAttribute("data-line");
  var data=(type==="sp"?PRED_SPREADS:PRED_OUS)[pk];
  if(!data||data[line]===undefined)return;
  var val=data[line];var pct=Math.round(val*100);
  var sec=el.parentElement.parentElement;
  var opts=el.parentElement.querySelectorAll(".pred-opt");
  for(var i=0;i<opts.length;i++)opts[i].classList.remove("active");
  el.classList.add("active");
  sec.querySelector(".pred-bar").innerHTML='<div class="pred-h" style="flex:'+pct+'"></div><div class="pred-a" style="flex:'+(100-pct)+'"></div>';
  sec.querySelector(".pred-labels").innerHTML='<span class="pred-lbl pred-lbl-h">'+(type==="sp"?"\u4e3b":"\u5927")+' '+pct+'%</span><span class="pred-lbl pred-lbl-a">'+(type==="sp"?"\u5ba2":"\u5c0f")+' '+(100-pct)+'%</span>';
}
// ===== DATA LOADING =====
function computeStandings() {
  groupData.forEach(function(g) {
    g.teams.forEach(function(t) { t.pl=0; t.w=0; t.d=0; t.l=0; t.gf=0; t.ga=0; t.gd=0; t.pts=0; });
  });
  matchesData.forEach(function(m) {
    if (m.round !== 'group' || m.status !== 'FINISHED' || m.home.score === undefined) return;
    var g = groupData.find(function(x) { return x.id === m.group; });
    if (!g) return;
    var ht = g.teams.find(function(x) { return x.cc === m.home.cc; });
    var at = g.teams.find(function(x) { return x.cc === m.away.cc; });
    if (!ht || !at) return;
    var hs = m.home.score, as = m.away.score;
    ht.pl++; at.pl++;
    ht.gf += hs; ht.ga += as; at.gf += as; at.ga += hs;
    if (hs > as) { ht.w++; ht.pts += 3; at.l++; }
    else if (hs === as) { ht.d++; ht.pts++; at.d++; at.pts++; }
    else { ht.l++; at.w++; at.pts += 3; }
  });
  groupData.forEach(function(g) {
    g.teams.forEach(function(t) { t.gd = t.gf - t.ga; });
  });
}

function fetchAndMerge() {
  var url = 'data.json?t=' + Date.now();
  fetch(url).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(d) {
    if (d.matches && Array.isArray(d.matches)) {
      d.matches.forEach(function(rm) {
        var m = matchesData.find(function(x) { return x.id === rm.id; });
        if (!m) return;
        if (rm.status) m.status = rm.status;
        if (rm.home && rm.home.score !== undefined) m.home.score = rm.home.score;
        if (rm.away && rm.away.score !== undefined) m.away.score = rm.away.score;
        if (rm.home && rm.home.stats) m.home.stats = rm.home.stats;
        if (rm.away && rm.away.stats) m.away.stats = rm.away.stats;
      });
      computeStandings();
    }
    
    if (d.predictions) {
      Object.keys(d.predictions).forEach(function(k) {
        var p = d.predictions[k];
        if (k.endsWith('_SPREADS')) {
          var matchKey = k.replace('_SPREADS','');
          PRED_SPREADS[matchKey] = p;
        } else if (k.endsWith('_OUS')) {
          var matchKey = k.replace('_OUS','');
          PRED_OUS[matchKey] = p;
        } else {
          if (p.home !== undefined) PRED[k] = p.home;
          if (p.draw !== undefined) PRED_D[k] = p.draw;
        }
      });
    }
    if (d.lastUpdated) {
      document.querySelector('.header-date').textContent = '\u66f4\u65b0\uff1a' + d.lastUpdated + ' \u00b7 FIFA.com | Polymarket';
    }
    renderG(); renderM(); renderB();
    try { lucide.createIcons(); } catch(e) {}
  }).catch(function(e) {
    console.log('Data fetch failed:', e.message);
    renderG(); renderM();
  });
}

function renderG(){
  var html='';
  groupData.forEach(function(g){
    var sorted=g.teams.slice().sort(function(a,b){return b.pts-a.pts||b.gd-a.gd||b.gf-a.gf});
    html+='<div class="group-card"><div class="group-header"><i data-lucide="layers"></i> '+g.id+' \u7ec4</div>';
    html+='<table class="group-table"><thead><tr><th>\u7403\u961f</th><th>\u573a\u6b21</th><th>\u80dc/\u5e73/\u8d1f</th><th>\u8fdb/\u5931</th><th>\u79ef\u5206</th></tr></thead><tbody>';
    sorted.forEach(function(t,i){
      html+='<tr onclick="showTD(\''+t.cc+'\',\''+g.id+'\')"><td><span class="rank">'+(i+1)+'</span><span class="team-cell">'+fh(t.cc)+'<span>'+t.name+'</span></span></td>';
      html+='<td>'+t.pl+'</td><td>'+t.w+'/'+t.d+'/'+t.l+'</td><td>'+t.gf+'/'+t.ga+'</td><td><strong>'+t.pts+'</strong></td></tr>';
    });
    html+='</tbody></table></div>';
  });
  document.getElementById('groupGrid').innerHTML=html;
}

function renderM(){
  var dates=['6\u670812\u65e5','6\u670813\u65e5','6\u670814\u65e5','6\u670815\u65e5','6\u670816\u65e5','6\u670817\u65e5','6\u670818\u65e5','6\u670819\u65e5','6\u670820\u65e5','6\u670821\u65e5','6\u670822\u65e5','6\u670823\u65e5','6\u670824\u65e5','6\u670825\u65e5','6\u670826\u65e5','6\u670827\u65e5','6\u670828\u65e5'];
  var labels=['6\u670812\u65e5 (\u4e94) \u00b7 \u7b2c1\u8f6e\uff082\u573a\uff09','6\u670813\u65e5 (\u516d) \u00b7 \u7b2c1\u8f6e\uff082\u573a\uff09','6\u670814\u65e5 (\u65e5) \u00b7 \u7b2c1\u8f6e\uff084\u573a\uff09','6\u670815\u65e5 (\u4e00) \u00b7 \u7b2c1\u8f6e\uff084\u573a\uff09','6\u670816\u65e5 (\u4e8c) \u00b7 \u7b2c2\u8f6e\uff084\u573a\uff09','6\u670817\u65e5 (\u4e09) \u00b7 \u7b2c2\u8f6e\uff084\u573a\uff09','6\u670818\u65e5 (\u56db) \u00b7 \u7b2c2\u8f6e\uff084\u573a\uff09','6\u670819\u65e5 (\u4e94) \u00b7 \u7b2c2\u8f6e\uff084\u573a\uff09','6\u670820\u65e5 (\u516d) \u00b7 \u7b2c2\u8f6e\uff084\u573a\uff09','6\u670821\u65e5 (\u65e5) \u00b7 \u7b2c3\u8f6e\uff084\u573a\uff09','6\u670822\u65e5 (\u4e00) \u00b7 \u7b2c3\u8f6e\uff084\u573a\uff09','6\u670823\u65e5 (\u4e8c) \u00b7 \u7b2c3\u8f6e\uff084\u573a\uff09','6\u670824\u65e5 (\u4e09) \u00b7 \u7b2c3\u8f6e\uff084\u573a\uff09','6\u670825\u65e5 (\u56db) \u00b7 \u7b2c3\u8f6e\uff086\u573a\uff09','6\u670826\u65e5 (\u4e94) \u00b7 \u7b2c3\u8f6e\uff086\u573a\uff09','6\u670827\u65e5 (\u516d) \u00b7 \u7b2c3\u8f6e\uff086\u573a\uff09','6\u670828\u65e5 (\u65e5) \u00b7 \u7b2c3\u8f6e\uff086\u573a\uff09'];
  var html='';
  for(var i=0;i<dates.length;i++){
    var d=dates[i],l=labels[i];
    var ms=matchesData.filter(function(m){return m.round==='group'&&m.bjDate===d});
    if(ms.length===0)continue;
    html+='<div class="match-day"><i data-lucide="clock"></i> '+l+'</div><div class="match-list">';
    ms.forEach(function(m){
      html+='<div class="match-item" onclick="showMD(\''+m.id+'\')">';
      var stLbl = (m.status==='FINISHED') ? '<span class="match-status" style="background:rgba(0,212,154,0.2);color:var(--accent)">\u5df2\u8d5b</span>' : '<span class="match-status upcoming">\u672a\u8d5b</span>'; html+='<div class="match-time">'+stLbl+'<div class="match-time-detail">'+m.bjTime+'</div></div>';
      html+='<div class="match-team right">'+fn(m.home.cc,m.home.name,20)+'</div>';
      var scr = (m.home.score !== undefined) ? m.home.score + '-' + m.away.score : '-'; if (m.status === 'UPCOMING') scr = '-'; html+='<div class="match-score">'+scr+'</div>';
      html+='<div class="match-team">'+fn(m.away.cc,m.away.name,20)+'</div>';
      html+='<div class="match-venue">'+m.stadium+'</div></div>';
    });
    html+='</div>';
  }
  document.getElementById('matchesContainer').innerHTML=html;
}

function bracketClick(m){
  if(m.home.cc!=='TBD'&&m.away.cc!=='TBD'){
    if(m.status==='UPCOMING'&&m.round==='r1'){
      showTD(m.home.cc.replace(/[0-9]/g,''),m.home.cc.charAt(0));
    }else{
      showMD(m.id);
    }
  }
}

function renderB(){
  var rounds=[{name:'1/16',key:'r1',cnt:16},{name:'1/8',key:'r2',cnt:8},{name:'1/4',key:'r3',cnt:4},{name:'\u534a\u51b3\u8d5b',key:'r4',cnt:2},{name:'\u5b63\u519b\u8d5b',key:'3p',cnt:1},{name:'\u51b3\u8d5b',key:'fi',cnt:1}];
  var html='';
  rounds.forEach(function(rd,ci){
    var ms=matchesData.filter(function(m){return m.round===rd.key}).slice(0,rd.cnt);
    var g2=Math.max(1,Math.pow(2,ci));
    html+='<div class="bracket-col"><div class="bracket-col-title">'+rd.name+'</div>';
    ms.forEach(function(m){
      html+='<div class="bracket-match-wrap" style="height:'+(g2*60)+'px"><div class="bracket-match" onclick="showMD(\''+m.id+'\')">';
      var hScr = (m.home.score !== undefined) ? m.home.score : (m.home.cc==='TBD'?'-':'?');
    html+='<div class="bm-team"><div class="bm-name">'+fs(m.home.cc,13)+' '+m.home.name+'</div><div class="bm-score">'+hScr+'</div></div>';
      var aScr = (m.away.score !== undefined) ? m.away.score : (m.away.cc==='TBD'?'-':'?');
    html+='<div class="bm-team"><div class="bm-name">'+fs(m.away.cc,13)+' '+m.away.name+'</div><div class="bm-score">'+aScr+'</div></div>';
      html+='</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('bracketContainer').innerHTML=html;
}

function renderT(){
  var all=[];
  GT.forEach(function(g){
    g.teams.forEach(function(t){
      all.push({cc:t.cc,name:t.name,r:t.r,group:g.id,cf:CF[t.cc]||'\u5176\u4ed6'});
    });
  });
  var f=all.filter(function(t){return(tC==='all'||t.cf===tC)&&(!tQ||t.name.indexOf(tQ)!==-1||t.cc.toLowerCase().indexOf(tQ.toLowerCase())!==-1)});
  f.sort(function(a,b){return tS==='rank'?(a.r||999)-(b.r||999):a.name.localeCompare(b.name,'zh-CN')});
  var html='';
  f.forEach(function(t){
    html+='<div class="team-card" onclick="showTD(\''+t.cc+'\',\''+t.group+'\')">'+fh(t.cc,28);
    html+='<div class="info"><div class="name">'+t.name+'</div><div class="confed">'+t.cf+' \u00b7 '+t.group+'\u7ec4 \u00b7 FIFA '+t.r+'</div></div>';
    html+='<div class="rank-badge">#'+t.r+'</div></div>';
  });
  document.getElementById('teamsGrid').innerHTML=html;
}

document.getElementById('modalClose').addEventListener('click',closeM);
document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===e.currentTarget)closeM()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeM()});
document.getElementById('teamSearch').addEventListener('input',function(e){tQ=e.target.value;renderT();try{lucide.createIcons()}catch(e){}});
document.getElementById('confedFilter').addEventListener('change',function(e){tC=e.target.value;renderT();try{lucide.createIcons()}catch(e){}});
document.getElementById('teamSort').addEventListener('change',function(e){tS=e.target.value;renderT();try{lucide.createIcons()}catch(e){}});
document.querySelectorAll('.tab-btn').forEach(function(b){
  b.addEventListener('click',function(){
    document.querySelectorAll('.tab-btn').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(function(p){p.classList.remove('active')});
    document.getElementById('tab-'+b.dataset.tab).classList.add('active');
    if(b.dataset.tab==='teams')renderT();
    if(b.dataset.tab==='bracket')renderB();
    try{lucide.createIcons()}catch(e){}
  });
});

// ===== INIT =====
fetchAndMerge();
// Auto-refresh every 30 seconds
setInterval(fetchAndMerge, 30000);
renderT();
renderG();
renderM();
renderB();
try{lucide.createIcons()}catch(e){}

</script>
